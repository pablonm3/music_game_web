<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>PROGRAMMER SAVE HUMANITY</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="view">
    <div id="terminal">
      <div id="board" hidden></div>
      <div id="text"></div>
      <div id="controls" aria-label="Touch controls">
        <div class="keys">
          <button type="button" data-action="back">ESC</button>
          <button type="button" data-action="confirm">ENTER</button>
          <button type="button" data-press="bomb">BOMB</button>
        </div>
        <div id="joystick" aria-label="joystick"><span class="knob"></span></div>
      </div>
    </div>
  </main>

  <div id="turn">TURN YOUR DEVICE TO LANDSCAPE</div>
</body>
</html>
